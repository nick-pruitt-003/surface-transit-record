agency = "TCATA (Twin Cities Area Transportation Authority)"

# Benton Harbor / St Joseph MI fixed routes, weekdays only. Times from TCATA's own weekday timetables (Remix PDFs,
# tcata.info, Nick Oct 23 2026). Stop points from TCATA's NTD GTFS export (2025, no stop_times); La Perla is the
# Tornado stop at 1231 Pipestone Rd. Harbor Towers and Burger King Stevensville are Nick's points (Oct 23 2026). Other stops with no point in that export are left out of the trips (Corewell, MDHHS,
# Walgreens, Grifols, Kartar, Meeting House, Broadway/Clay, Broadway/Catalpa, Berrien Courthouse, 601 Port St,
# Papa John's, Burger King, MDOT Park & Ride). Blue: Harbor Towers 58 is one minute before the transit center on the
# Red timetable, so the transit center arrival is entered at 59 (inferred). Saturday (Nick Oct 23 2026, same stop offsets): Blue hourly 08:00-21:00, Red hourly 08:04-21:04 plus 22:04 to the transit center. TCATA does not run on Sundays (Nick Oct 23 2026).

