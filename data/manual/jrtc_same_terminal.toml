# Same-terminal connection at the Jacksonville Regional Transportation Center (JRTC), Nick's ruling Nov 24 2026.
# Greyhound US0760 Tallahassee 11:25 -> Jacksonville (Downtown) 14:50 lands at JRTC, one bay from JTA route 4, whose
# 14:50 departure from JRTC Bay H reaches the Amtrak station at 15:19, ahead of the Silver Meteor (16:11). JTA's
# Nov 2 2026 feed made route 4 hourly (it was every 30 min, with a 15:00), and the router cannot make this connection:
# it charges 57 s of walking to Bay H plus the 5 min transfer. Modelled as one through-trip, so riding it is staying
# aboard (no transfer) across the bay change. Both legs remain in their own feeds; this adds only the 0 min link.
# Days: JTA trip 1963020 runs Mon-Fri (service 2, to Mar 21 2027); the Greyhound service is daily (this version
# Dec 1-31 2026 in the Nov 4 feed). Manual trips have no date range, so re-check both after any feed update.
# Disable with BUS48_SKIP_MANUAL=jrtc_same_terminal to compare against the strict 5 min rule.
agency = "Greyhound + JTA (JRTC same terminal)"

