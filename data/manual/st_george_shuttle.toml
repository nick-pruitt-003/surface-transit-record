agency = "St George Shuttle"

# St George Shuttle is its own carrier, not Salt Lake Express (Nick, Oct 15 2026). Northbound runs from Nick's
# screenshots of its booking site for Wed Oct 28 2026, each stop's local clock (Las Vegas Pacific, Utah Mountain); the
# site sells Las Vegas -> SLC as two legs with a layover at St George. Southbound: the 06:00 from SLC Airport, read Oct 1
# for Oct 16 (Midvale 06:30 not modelled). Orem Central Station is timetabled 1 h 05 from SLC Airport each way (Nick
# Oct 15 2026). Daily assumed throughout.
# Every Las Vegas <-> St George run stops at Beaver Dam AZ (Nick Oct 15 2026: NV, AZ and UT on one bus); its time is
# not on the site, so it is St George -/+ 35 min, the offset of SLE's runs on the same road (approximate).
# The St George stop is taken as SLE's Bluff St office: the shuttle's own St George address is not yet known.
[stops]
las_vegas_airport = "=ibus:735"   # Las Vegas (Airport), Harry Reid
st_george = "=ibus:2067"   # Saint George (Bluff St Office), approximate for the shuttle's stop
slc_airport = "=ibus:2060"   # Salt Lake City (Airport)
beaver_dam = "Beaver Dam"   # Beaver Dam AZ, shared with SLE
orem = { name = "Orem Central Station (St George Shuttle)", lon = -111.7267, lat = 40.2808 }   # 1350 W 900 S (Nick Oct 15 2026; OSM geocode), FrontRunner

[[trip]]
id = "t466"
route = "St George Shuttle Las Vegas Airport 06:00 -> St George 09:10"
days = "1111111"
stops = ["las_vegas_airport 06:00", "beaver_dam 08:35", "st_george 09:10"]

