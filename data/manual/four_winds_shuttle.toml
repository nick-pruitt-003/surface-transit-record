agency = "Four Winds Casino Shuttle (Chinatown)"

# fourwindscasinoshuttle.com/chinatown (Nick, Oct 3 2026). All times CST as printed, so tz = America/Chicago even though
# the casino (New Buffalo MI) keeps Eastern. 21+ with photo ID; $10 fare with $20 slot play. The Wed-Sat runs are the
# expansion "starting Wednesday, October 28, 2026". Return arrival times in Chicago are not published: assumed equal
# to the outbound 1 h 40 min (casino -> 35th & State). Casino point approximate.
