# 8035/8040 are written on one UTC-7 clock (America/Phoenix), which in the Nov window is Utah's MST and Arizona's
# time; Las Vegas 11:40/13:50 PST reads 12:40/14:50 here. The site's per-stop clocks were from daylight time
# (Utah UTC-6), and under winter time the Beaver Dam rows ran backwards and rolled a day (review Oct 11).
# Offsets kept from the screenshot: Sun River +5, Beaver Dam +35, Mesquite +45, Las Vegas +2:10.
# SLE 7021 SLC Airport 04:45 -> St George 10:20 (from a Google listing) removed Oct 15 2026: Nick, it does not exist.

[[trip]]
