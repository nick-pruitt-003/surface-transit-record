agency = "UCAP Community Transit (Rock County MN, booked dial-a-ride)"

# United Community Action Partnership Community Transit: general-public rural dial-a-ride (fare policy 2025: $2-5 by
# distance, book by 4:30 pm the day before; volunteer drivers $.60/mile). Nick: the Luverne site says rides can be
# booked to Sioux Falls. Modelled as a booked ride Luverne -> Sioux Falls (Jefferson stop), 45 min, pickups every
# 15 min 07:00-17:00 on weekdays: service hours and days are ASSUMED, confirm with UCAP. Counts as local transit under
# Nick's rules (public, bookable by anyone; not ADA paratransit, not a taxi).
[stops]
luverne = "=ibus:1296"   # Luverne (Express Way)
sioux_falls_jl = "=ibus:186"   # Sioux Falls (Jefferson)

