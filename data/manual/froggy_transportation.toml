agency = "Froggy Transportation"

# Toledo <-> Detroit Metro Airport shuttle (froggytransportation.com bus-fares and bus-stops, read Oct 16 2026; Nick).
# Booked: reservations at least 1 h ahead. A scheduled shuttle, not a taxi. DTW is in Michigan (Romulus), so from
# Toledo it is a two-hour MI round trip (Franklin Park 09:00 -> McNamara 09:50, back 09:57 -> Toledo 11:05).
# Outbound boards at Hope United (4069 W Sylvania Ave) then Franklin Park (4242 Royer Rd, at the TARTA stop between
# JCPenney and Kohl's); return runs end at Franklin Park ("Toledo bus stop"). Airport stops are the McNamara and Evans
# Ground Transportation Centers (points approximate). Local clocks (Eastern throughout).
[stops]
hope_united = { name = "Toledo Hope United Methodist Church (Froggy)", lon = -83.6398, lat = 41.6912 }   # 4069 W Sylvania Ave (OSM geocode)
franklin_park = { name = "Toledo Franklin Park (Froggy)", lon = -83.6370, lat = 41.6939 }   # 4242 Royer Rd (OSM geocode)
dtw_mcnamara = { name = "Detroit Metro Airport McNamara Terminal (Froggy)", lon = -83.3524, lat = 42.2126 }   # approximate
dtw_evans = { name = "Detroit Metro Airport Evans Terminal (Froggy)", lon = -83.3567, lat = 42.2228 }   # approximate

