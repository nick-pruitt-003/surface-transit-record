agency = "Express Arrow"

# Nick screenshots Oct 5 2026 (booking, operated by Black Hills Stage Lines). Replace the feed's ibus 1029 / 1459,
# which had Denver 10:00 -> Omaha 20:40 and Omaha 07:15 -> Denver 18:10. Times are each stop's local clock (Denver,
# Brush and Ogallala Mountain; North Platte and east Central); a printed dwell is taken as arrive/depart.
# Denver <-> Omaha is twice a day each way: this and Greyhound (Burlington Trailways no longer runs it).

